<body>

<div id="stats" class="stats"></div>

<input
id="search"
class="search"
placeholder="Search title or author">

<button onclick="startScanner()">📷 Scan Book</button>


<div id="scanResult"></div>

<div id="scanner"></div>

<div id="books"></div>

<script src="https://unpkg.com/@zxing/library@0.20.0"></script>

let saved = JSON.parse(
localStorage.getItem("penguinLibrary") || "{}"
);

let archivedBooks = JSON.parse(
localStorage.getItem("penguinArchivedBooks") || "[]"
);
function render(){

    let search =
        document.getElementById("search").value.toLowerCase();

    let area =
        document.getElementById("books");

    area.innerHTML="";

    let owned=0;
    let read=0;
    let wishlist=0;

    books.forEach((book,index)=>{

        if(saved[index]?.owned) owned++;
        if(saved[index]?.read) read++;
        if(saved[index]?.wishlist) wishlist++;

        let text =
            (book[0]+" "+book[1]).toLowerCase();

        if(text.includes(search)){

            area.innerHTML+=`

<div class="book">

<b>${index+1}. ${book[0]}</b>

<div class="author">${book[1]}</div>

<label>
<input type="checkbox"
${saved[index]?.owned?"checked":""}
onchange="updateBook(${index},'owned')">
I own this
</label>

<label>
<input type="checkbox"
${saved[index]?.read?"checked":""}
onchange="updateBook(${index},'read')">
I have read this
</label>

<label>
<input type="checkbox"
${saved[index]?.wishlist?"checked":""}
onchange="updateBook(${index},'wishlist')">
Wishlist
</label>
<label>
<input type="checkbox"
onchange="archiveBook(${index})">
Archive this book
</label>

</div>

`;

        }

    });

    document.getElementById("stats").innerHTML =
        `Owned: ${owned} | Read: ${read} | Wishlist: ${wishlist} | Total: ${books.length}`;

}
    function updateBook(index,type){

    if(!saved[index]){
        saved[index]={};
    }

    saved[index][type]=!saved[index][type];

    localStorage.setItem(
        "penguinLibrary",
        JSON.stringify(saved)
    );

    render();
}


document
.getElementById("search")
.addEventListener("input",render);


render();

function cleanISBN(code){

    return code.toString().replace(/\D/g,'');

}
async function startScanner(){

    document.getElementById("scanner").innerHTML =
    '<video id="camera" autoplay playsinline></video>';

    document.getElementById("scanResult").innerHTML =
    "Starting scanner...";

    const video = document.getElementById("camera");

    try {

        codeReader = new ZXing.BrowserMultiFormatReader();

       await codeReader.decodeFromConstraints(
    {
        video: {
           facingMode: { ideal: "environment" },
width: { ideal: 1920 },
height: { ideal: 1080 }
        }
    },
            video,
            (result, error) => {
if(result){

let raw = result.text.toString();

console.log("RAW BARCODE:", raw);

let isbn = cleanISBN(raw);

console.log("CLEAN ISBN:", isbn);

alert("ISBN SENT: " + isbn);

stopScanner();

let raw = result.text;

alert("RAW = " + raw);

stopScanner();

}
});
}
catch(error){
    console.log(error);
}
}
function stopScanner(){

    if(codeReader){
        codeReader.reset();
    }

    let video = document.getElementById("camera");

    if(video && video.srcObject){
        video.srcObject.getTracks().forEach(track => track.stop());
    }

    document.getElementById("scanner").innerHTML="";

}
async function lookupISBNNumber(isbn){

    let result = document.getElementById("scanResult");

    result.innerHTML = "Looking up ISBN: " + isbn;

    try {

        let title = "";
        let author = "";

        // Try OpenLibrary first
        let response = await fetch(
            "https://openlibrary.org/api/books?bibkeys=ISBN:" + isbn + "&format=json&jscmd=data"
        );

        let data = await response.json();

        console.log("OpenLibrary:", data);

        let book = data["ISBN:" + isbn];


        if(book){

            title = book.title;

            if(book.authors && book.authors.length){

                author = book.authors[0].name || "";

            }

        }


        // If OpenLibrary failed, try Google Books
        if(!title){

            console.log("Trying Google Books...");

            let googleResponse = await fetch(
                "https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn
            );

            let googleData = await googleResponse.json();

            console.log("Google Books:", googleData);


            if(googleData.totalItems > 0){

                let info = googleData.items[0].volumeInfo;

                title = info.title || "";

                author = info.authors 
                    ? info.authors.join(", ")
                    : "";

            }

        }


        if(!title){

            throw new Error("Book not found");

        }


        result.innerHTML = `
        <div class="book">

            <b>${title}</b>
            <br>
            ${author || "Unknown author"}
            <br>
            ISBN: ${isbn}

            <br><br>

            <button onclick="addScannedBook(
            '${title.replace(/'/g,"\\'")}',
            '${author.replace(/'/g,"\\'")}'
            )">

            Add to Library

            </button>

        </div>
        `;


    }

    catch(error){

        result.innerHTML =
        "Lookup error: " + error.message;

        console.log(error);

    }

}

function addScannedBook(title,author){


    books.push(
        [title,author]
    );


    localStorage.setItem(
        "penguinLibraryBooks",
        JSON.stringify(books)
    );


    alert(title+" added!");
document.getElementById("scanResult").innerHTML = "";

    render();

}

function deleteBook(index){

    if(confirm("Remove this book from your library?")){

        books.splice(index,1);

        localStorage.setItem(
            "penguinLibraryBooks",
            JSON.stringify(books)
        );

        delete saved[index];

        localStorage.setItem(
            "penguinLibrary",
            JSON.stringify(saved)
        );

        render();
    }

}
function archiveBook(index){

    if(confirm("Move this book to the archive?")){

        archivedBooks.push(books[index]);

        books.splice(index,1);

        localStorage.setItem(
            "penguinArchivedBooks",
            JSON.stringify(archivedBooks)
        );

        localStorage.setItem(
            "penguinLibraryBooks",
            JSON.stringify(books)
        );

        render();

    }

}
