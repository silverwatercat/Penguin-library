<body>

<h1>📚 Penguin Library</h1>

<div class="stats" id="stats"></div>

<input class="search" id="search" placeholder="Search title or author">

<button onclick="startScanner()">📷 Scan Book</button>

<div id="scanner" style="margin-top:15px;"></div>

<div id="scanResult" class="book"></div>

<div id="books"></div>
<script src="https://unpkg.com/@zxing/browser@latest"></script>

  let saved = JSON.parse(localStorage.getItem("penguinLibrary") || "{}");

function render() {

  let search = document.getElementById("search").value.toLowerCase();
  let area = document.getElementById("books");

  area.innerHTML = "";

  let owned = 0;
  let read = 0;
  let wishlist = 0;

  books.forEach((book,index)=>{

    if(saved[index]?.owned) owned++;
    if(saved[index]?.read) read++;
    if(saved[index]?.wishlist) wishlist++;

    let text = (book[0] + " " + book[1]).toLowerCase();

    if(text.includes(search)) {

      area.innerHTML += `

      <div class="book">

      <b>${index + 1}. ${book[0]}</b>

      <div class="author">${book[1]}</div>

      <div class="checks">

      <label>
      <input type="checkbox"
      ${saved[index]?.owned ? "checked":""}
      onchange="updateBook(${index},'owned')">
      I own this
      </label>

      <label>
      <input type="checkbox"
      ${saved[index]?.read ? "checked":""}
      onchange="updateBook(${index},'read')">
      I have read this
      </label>

      <label>
      <input type="checkbox"
      ${saved[index]?.wishlist ? "checked":""}
      onchange="updateBook(${index},'wishlist')">
      Wishlist
      </label>

      </div>

      </div>

      `;
    }

  });


  document.getElementById("stats").innerHTML =
  "Owned: " + owned +
  " | Read: " + read +
  " | Wishlist: " + wishlist +
  " | Total: " + books.length;

}


function updateBook(index,type){

  if(!saved[index]){
    saved[index]={};
  }

  saved[index][type] = !saved[index][type];

  localStorage.setItem(
    "penguinLibrary",
    JSON.stringify(saved)
  );

  render();

}


document
.getElementById("search")
.addEventListener("input",render);

render();

async function lookupISBNNumber(isbn){

lookupISBNNumber(isbn);

});

}


async function lookupISBNNumber(isbn){

let result=document.getElementById("scanResult");

result.innerHTML="Looking up ISBN "+isbn+"...";

try{

let response=await fetch(
"https://openlibrary.org/isbn/"+isbn+".json"
);

let data=await response.json();

let title=data.title || "Unknown title";
let author="Unknown author";

if(data.authors){
author=data.authors[0].name || author;
}


result.innerHTML=`

<b>${title}</b>
<br>
${author}
<br>
ISBN: ${isbn}

<br><br>

<button onclick="addScannedBook('${title.replace(/'/g,"\\'")}','${author.replace(/'/g,"\\'")}')">
Add to Library
</button>

`;

}

catch{

result.innerHTML="Book not found.";

}

}



function addScannedBook(title,author){

books.push([title,author]);

localStorage.setItem(
"penguinLibraryBooks",
JSON.stringify(books)
);

alert(title+" added!");

render();

}
