button:hover{ background:#555; }

}

    width:100%;

}

 .search-container{
    position:relative;

}

.search{
    width:100%;

    padding:0 46px 0 14px;
    border:1px solid #bbb;

    font-size:16px;
    box-sizing:border-box;
}

.scan-icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-85%);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#666;
    transition:.2s;
}

.scan-icon:hover{
    color:#111;
}   
.scan-icon svg{
    display:block;
}

<body>

<script src="https://unpkg.com/@zxing/library@0.20.0"></script>

let saved = JSON.parse(localStorage.getItem("penguinLibrary") || "{}");
let archivedBooks = JSON.parse(localStorage.getItem("penguinArchivedBooks") || "[]");

function render() {
  const search = document.getElementById("search").value.toLowerCase();
  const area = document.getElementById("books");
  area.innerHTML = "";

  let owned = 0, read = 0, wishlist = 0;

  books.forEach((book, index) => {
    if (saved[index]?.owned) owned++;
    if (saved[index]?.read) read++;
    if (saved[index]?.wishlist) wishlist++;

    const text = (book[0] + " " + book[1]).toLowerCase();
    if (!text.includes(search)) return;

    area.innerHTML += `
      <div class="book">
        <b>${index + 1}. ${book[0]}</b>
        <div class="author">${book[1]}</div>

        <label>
          <input type="checkbox" ${saved[index]?.owned ? "checked" : ""}
                 onchange="updateBook(${index},'owned')">
          I own this
        </label>

        <label>
          <input type="checkbox" ${saved[index]?.read ? "checked" : ""}
                 onchange="updateBook(${index},'read')">
          I have read this
        </label>

        <label>
          <input type="checkbox" ${saved[index]?.wishlist ? "checked" : ""}
                 onchange="updateBook(${index},'wishlist')">
          Wishlist
        </label>

        <label>
          <input type="checkbox" onchange="archiveBook(${index})">
          Archive this book
        </label>
      </div>`;
  });

  document.getElementById("stats").innerHTML =
    `Owned: ${owned} | Read: ${read} | Wishlist: ${wishlist} | Total: ${books.length}`;
}

function updateBook(index, type) {
  if (!saved[index]) saved[index] = {};
  saved[index][type] = !saved[index][type];
  localStorage.setItem("penguinLibrary", JSON.stringify(saved));
  render();
}

function rekeySavedAfterRemoval(removedIndex) {
  const newSaved = {};
  Object.keys(saved).forEach(key => {
    const i = Number(key);
    if (i < removedIndex) newSaved[i] = saved[i];
    else if (i > removedIndex) newSaved[i - 1] = saved[i];
  });
  saved = newSaved;
  localStorage.setItem("penguinLibrary", JSON.stringify(saved));
}

function archiveBook(index) {
  if (!confirm("Move this book to the archive?")) return;

  archivedBooks.push(books[index]);
  books.splice(index, 1);

  localStorage.setItem("penguinArchivedBooks", JSON.stringify(archivedBooks));
  localStorage.setItem("penguinLibraryBooks", JSON.stringify(books));

  rekeySavedAfterRemoval(index);
  render();
}

function cleanISBN(code) {
  let isbn = String(code).replace(/\D/g, "");

  if (isbn.length === 13) return isbn;

  // Convert ISBN-10 → ISBN-13
  if (isbn.length === 10) {
    isbn = "978" + isbn.substring(0, 9);
  }
  // Some UPC-A book barcodes are 12 digits
  else if (isbn.length === 12) {
    isbn = "978" + isbn.substring(0, 9);
  } else {
    return "";
  }

  // Calculate check digit
  let sum = 0;
  for (let i = 0; i < 12; i++) {
    sum += (i % 2 === 0) ? Number(isbn[i]) : Number(isbn[i]) * 3;
  }
  const check = (10 - (sum % 10)) % 10;
  return isbn + check;
}
   async function startScanner() {
  document.getElementById("scanResult").innerHTML = "";
  stopScanner();

  document.getElementById("scanner").innerHTML =
    '<video id="camera" autoplay playsinline></video>';
  document.getElementById("scanResult").innerHTML = "Starting camera…";

  const video = document.getElementById("camera");

  try {
    codeReader = new ZXing.BrowserMultiFormatReader();

    await codeReader.decodeFromConstraints(
      {
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      },
      video,
      (result, err) => {
        if (result) {
          const raw = result.text;
          const isbn = cleanISBN(raw);
          console.log("Raw:", raw, "→ ISBN:", isbn);

          stopScanner();
          lookupISBNNumber(isbn);
        }
        // ignore NotFoundException (normal while scanning)
      }
    );

    document.getElementById("scanResult").innerHTML = "Point camera at barcode…";
  } catch (error) {
    console.error(error);
    document.getElementById("scanResult").innerHTML =
      "Camera error: " + error.message;
  }
}

function stopScanner() {
  if (codeReader) {
    try { codeReader.reset(); } catch (e) {}
    codeReader = null;
  }

  const video = document.getElementById("camera");
  if (video && video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
  }
  document.getElementById("scanner").innerHTML = "";
}

async function lookupISBNNumber(isbn) {
  const resultEl = document.getElementById("scanResult");

  if (!isbn) {
    resultEl.innerHTML = "Invalid barcode – no ISBN detected";
    return;
  }

  resultEl.innerHTML = "Looking up ISBN: " + isbn + " …";

  function escapeAttr(str) {
    return String(str)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, "&quot;");
  }
function showBook(title, author, isbn) {
  const alreadyInLibrary = books.some(
    b => b[0].toLowerCase() === title.toLowerCase()
  );

  let actionButton;

  if (alreadyInLibrary) {
    actionButton = `
      <button style="background:#666; cursor:default;" disabled>
        Already in Library
      </button>`;
  } else {
    actionButton = `
      <button onclick="addScannedBook('${escapeAttr(title)}', '${escapeAttr(author)}')">
        Add to Library
      </button>`;
  }

  resultEl.innerHTML = `
    <div class="book">
      <b>${title}</b><br>
      ${author}<br>
      ISBN: ${isbn}<br><br>
      ${alreadyInLibrary
        ? '<div style="color:#2a7; font-weight:bold; margin-bottom:8px;">✓ This book is already in your library</div>'
        : '<div style="color:#a50; font-weight:bold; margin-bottom:8px;">Not in your library yet</div>'}
      ${actionButton}
      <button onclick="document.getElementById('scanResult').innerHTML=''" style="background:#666; margin-left:8px;">
        Dismiss
      </button>
    </div>`;
}
  function fetchWithTimeout(url, ms = 5000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    return fetch(url, { signal: controller.signal })
      .then(res => {
        clearTimeout(timer);
        return res;
      })
      .catch(err => {
        clearTimeout(timer);
        throw err;
      });
  }

  // Resolve Open Library author keys → real names
  async function resolveAuthorNames(authors) {
    if (!authors || !authors.length) return "Unknown author";

    // Already have names?
    const names = authors.map(a => a.name).filter(Boolean);
    if (names.length) return names.join(", ");

    // Only keys like /authors/OL581728A — look them up
    const namePromises = authors.slice(0, 3).map(async (a) => {
      const key = a.key; // e.g. "/authors/OL581728A"
      if (!key) return null;
      try {
        const res = await fetchWithTimeout(
          "https://openlibrary.org" + key + ".json",
          3000
        );
        if (!res.ok) return null;
        const data = await res.json();
        return data.name || data.personal_name || null;
      } catch {
        return null;
      }
    });

    const resolved = (await Promise.all(namePromises)).filter(Boolean);
    return resolved.length ? resolved.join(", ") : "Unknown author";
  }

  // --- 1. Google Books (usually best: real names + fast) ---
  try {
    resultEl.innerHTML = "Trying Google Books…";
    const res = await fetchWithTimeout(
      "https://www.googleapis.com/books/v1/volumes?q=isbn:" + encodeURIComponent(isbn)
    );
    if (res.ok) {
      const data = await res.json();
      if (data.items && data.items.length > 0) {
        const info = data.items[0].volumeInfo;
        const title = info.title || "Unknown title";
        const author = info.authors ? info.authors.join(", ") : "Unknown author";
        showBook(title, author, isbn);
        return;
      }
    }
  } catch (e) {
    console.warn("Google Books failed:", e.name);
  }

  // --- 2. Open Library search (also returns author_name) ---
  try {
    resultEl.innerHTML = "Trying Open Library…";
    const res = await fetchWithTimeout(
      "https://openlibrary.org/search.json?isbn=" + encodeURIComponent(isbn) +
      "&fields=title,author_name&limit=1"
    );
    if (res.ok) {
      const data = await res.json();
      if (data.docs && data.docs.length > 0) {
        const doc = data.docs[0];
        const title = doc.title || "Unknown title";
        const author = doc.author_name ? doc.author_name.join(", ") : "Unknown author";
        showBook(title, author, isbn);
        return;
      }
    }
  } catch (e) {
    console.warn("Open Library search failed:", e.name);
  }

  // --- 3. Open Library /isbn/… (may only have author keys) ---
  try {
    resultEl.innerHTML = "Trying Open Library (direct)…";
    const res = await fetchWithTimeout(
      "https://openlibrary.org/isbn/" + encodeURIComponent(isbn) + ".json"
    );
    if (res.ok) {
      const data = await res.json();
      const title = data.title || "Unknown title";

      let author = "Unknown author";
      if (data.by_statement) {
        author = data.by_statement;
      } else if (data.authors && data.authors.length) {
        author = await resolveAuthorNames(data.authors);
      }

      showBook(title, author, isbn);
      return;
    }
  } catch (e) {
    console.warn("Open Library /isbn/ failed:", e.name);
  }

  // All failed
  resultEl.innerHTML = `
    <div class="book" style="border-color:#c00;">
      <b>Could not look up ISBN ${isbn}</b><br><br>
      All sources timed out or returned nothing.<br>
      Try again in a minute, or add the book manually.
    </div>`;
}

function addScannedBook(title, author) {
  const exists = books.some(
    b => b[0].toLowerCase() === title.toLowerCase()
  );

  if (exists) {
    alert("This book is already in your library.");
    document.getElementById("scanResult").innerHTML = "";
    return;
  }

  books.push([title, author]);
  localStorage.setItem("penguinLibraryBooks", JSON.stringify(books));

  alert(title + " added!");
  document.getElementById("scanResult").innerHTML = "";  // ← clears the box
  render();
}
function showMainLibrary() {
  document.getElementById("books").style.display = "block";
  document.getElementById("archive").style.display = "none";
  document.getElementById("search").style.display = "block";
  render();
}

function showArchive() {
  document.getElementById("books").style.display = "none";
  document.getElementById("archive").style.display = "block";
  document.getElementById("search").style.display = "none";
  renderArchive();
}

function renderArchive() {
  const area = document.getElementById("archive");
  area.innerHTML = "";

  if (archivedBooks.length === 0) {
    area.innerHTML = "<p>No books in the archive.</p>";
    return;
  }

  area.innerHTML = `<div class="stats">Archived: ${archivedBooks.length}</div>`;

  archivedBooks.forEach((book, index) => {
    area.innerHTML += `
      <div class="book">
        <b>${book[0]}</b>
        <div class="author">${book[1]}</div>

        <button onclick="restoreBook(${index})" style="margin-top:8px; margin-right:8px;">
          Restore to Library
        </button>
        <button onclick="deleteArchivedBook(${index})" style="background:#a33;">
          Delete Forever
        </button>
      </div>`;
  });
}

function restoreBook(index) {
  if (!confirm("Move this book back to your library?")) return;

  books.push(archivedBooks[index]);
  archivedBooks.splice(index, 1);

  localStorage.setItem("penguinLibraryBooks", JSON.stringify(books));
  localStorage.setItem("penguinArchivedBooks", JSON.stringify(archivedBooks));

  renderArchive();
  // optional: switch back to main library
  // showMainLibrary();
}

function deleteArchivedBook(index) {
  if (!confirm("Permanently delete this book? This cannot be undone.")) return;

  archivedBooks.splice(index, 1);
  localStorage.setItem("penguinArchivedBooks", JSON.stringify(archivedBooks));
  renderArchive();
}
document.getElementById("search").addEventListener("input", render);
render();
</script>
