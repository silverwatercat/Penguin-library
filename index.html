<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penguin Library</title>
<style>
body{
    font-family:Georgia,serif;
    background:#f7f3ea;
    margin:20px;
    color:#222;
}
h1{ text-align:center; }
.search{
    width:100%;
    padding:12px;
    font-size:16px;
    border-radius:8px;
    border:1px solid #999;
    margin-bottom:12px;
    box-sizing:border-box;
}
button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    background:#333;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-right:8px;
}
button:hover{ background:#555; }
.stats{
    margin:15px 0;
    font-weight:bold;
}
.book{
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:12px;
}
.author{
    color:#666;
    margin-bottom:8px;
}
label{
    display:block;
    margin-top:6px;
}
video{
    width:100%;
    max-width:400px;
    border-radius:8px;
    margin-top:15px;
}
#scanResult{ margin-top:15px; }
</style>
</head>
<body>

<h1>📚 Penguin Library</h1>

<div id="stats" class="stats"></div>

<input id="search" class="search" placeholder="Search title or author">

<button onclick="startScanner()">📷 Scan Book</button>
<button onclick="stopScanner()">⏹ Stop Scanner</button>

<div id="scanResult"></div>
<div id="scanner"></div>
<div id="books"></div>

<script src="https://unpkg.com/@zxing/library@0.20.0"></script>

let codeReader = null;

  ["Love in the Time of Cholera","Gabriel García Márquez"]
];

let saved = JSON.parse(localStorage.getItem("penguinLibrary") || "{}");
let archivedBooks = JSON.parse(localStorage.getItem("penguinArchivedBooks") || "[]");

function render() {
  const search = document.getElementById("search").value.toLowerCase();
  const area = document.getElementById("books");
  area.innerHTML = "";

  let owned = 0, read = 0, wishlist = 0;

  books.forEach((book, index) => {
    if (saved[index]?.owned) owned++;
    if (saved[index]?.read) read++;
    if (saved[index]?.wishlist) wishlist++;

    const text = (book[0] + " " + book[1]).toLowerCase();
    if (!text.includes(search)) return;

    area.innerHTML += `
      <div class="book">
        <b>${index + 1}. ${book[0]}</b>
        <div class="author">${book[1]}</div>

        <label>
          <input type="checkbox" ${saved[index]?.owned ? "checked" : ""}
                 onchange="updateBook(${index},'owned')">
          I own this
        </label>

        <label>
          <input type="checkbox" ${saved[index]?.read ? "checked" : ""}
                 onchange="updateBook(${index},'read')">
          I have read this
        </label>

        <label>
          <input type="checkbox" ${saved[index]?.wishlist ? "checked" : ""}
                 onchange="updateBook(${index},'wishlist')">
          Wishlist
        </label>

        <label>
          <input type="checkbox" onchange="archiveBook(${index})">
          Archive this book
        </label>
      </div>`;
  });

  document.getElementById("stats").innerHTML =
    `Owned: ${owned} | Read: ${read} | Wishlist: ${wishlist} | Total: ${books.length}`;
}

function updateBook(index, type) {
  if (!saved[index]) saved[index] = {};
  saved[index][type] = !saved[index][type];
  localStorage.setItem("penguinLibrary", JSON.stringify(saved));
  render();
}

function rekeySavedAfterRemoval(removedIndex) {
  const newSaved = {};
  Object.keys(saved).forEach(key => {
    const i = Number(key);
    if (i < removedIndex) newSaved[i] = saved[i];
    else if (i > removedIndex) newSaved[i - 1] = saved[i];
  });
  saved = newSaved;
  localStorage.setItem("penguinLibrary", JSON.stringify(saved));
}

function archiveBook(index) {
  if (!confirm("Move this book to the archive?")) return;

  archivedBooks.push(books[index]);
  books.splice(index, 1);

  localStorage.setItem("penguinArchivedBooks", JSON.stringify(archivedBooks));
  localStorage.setItem("penguinLibraryBooks", JSON.stringify(books));

  rekeySavedAfterRemoval(index);
  render();
}

function cleanISBN(code) {
  let isbn = String(code).replace(/\D/g, "");

  if (isbn.length === 13) return isbn;

  // Convert ISBN-10 → ISBN-13
  if (isbn.length === 10) {
    isbn = "978" + isbn.substring(0, 9);
  }
  // Some UPC-A book barcodes are 12 digits
  else if (isbn.length === 12) {
    isbn = "978" + isbn.substring(0, 9);
  } else {
    return "";
  }

  // Calculate check digit
  let sum = 0;
  for (let i = 0; i < 12; i++) {
    sum += (i % 2 === 0) ? Number(isbn[i]) : Number(isbn[i]) * 3;
  }
  const check = (10 - (sum % 10)) % 10;
  return isbn + check;
}

async function startScanner() {
  stopScanner(); // clean previous session

  document.getElementById("scanner").innerHTML =
    '<video id="camera" autoplay playsinline></video>';
  document.getElementById("scanResult").innerHTML = "Starting camera…";

  const video = document.getElementById("camera");

  try {
    codeReader = new ZXing.BrowserMultiFormatReader();

    await codeReader.decodeFromConstraints(
      {
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      },
      video,
      (result, err) => {
        if (result) {
          const raw = result.text;
          const isbn = cleanISBN(raw);
          console.log("Raw:", raw, "→ ISBN:", isbn);

          stopScanner();
          lookupISBNNumber(isbn);
        }
        // ignore NotFoundException (normal while scanning)
      }
    );

    document.getElementById("scanResult").innerHTML = "Point camera at barcode…";
  } catch (error) {
    console.error(error);
    document.getElementById("scanResult").innerHTML =
      "Camera error: " + error.message;
  }
}

function stopScanner() {
  if (codeReader) {
    try { codeReader.reset(); } catch (e) {}
    codeReader = null;
  }

  const video = document.getElementById("camera");
  if (video && video.srcObject) {
    video.srcObject.getTracks().forEach(t => t.stop());
  }
  document.getElementById("scanner").innerHTML = "";
}

async function lookupISBNNumber(isbn) {
  const resultEl = document.getElementById("scanResult");

  if (!isbn) {
    resultEl.innerHTML = "Invalid barcode – no ISBN detected";
    return;
  }

  resultEl.innerHTML = "Looking up ISBN: " + isbn + " …";

  function escapeAttr(str) {
    return String(str)
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'")
      .replace(/"/g, "&quot;");
  }

  function showBook(title, author, isbn) {
    resultEl.innerHTML = `
      <div class="book">
        <b>${title}</b><br>
        ${author}<br>
        ISBN: ${isbn}<br><br>
        <button onclick="addScannedBook('${escapeAttr(title)}', '${escapeAttr(author)}')">
          Add to Library
        </button>
      </div>`;
  }

  // Fetch with a hard timeout (default 5 seconds)
  function fetchWithTimeout(url, ms = 5000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);

    return fetch(url, { signal: controller.signal })
      .then(res => {
        clearTimeout(timer);
        return res;
      })
      .catch(err => {
        clearTimeout(timer);
        throw err;
      });
  }

  // --- 1. Google Books (usually fastest & most reliable) ---
  try {
    resultEl.innerHTML = "Trying Google Books…";
    const res = await fetchWithTimeout(
      "https://www.googleapis.com/books/v1/volumes?q=isbn:" + encodeURIComponent(isbn)
    );
    if (res.ok) {
      const data = await res.json();
      if (data.items && data.items.length > 0) {
        const info = data.items[0].volumeInfo;
        const title = info.title || "Unknown title";
        const author = info.authors ? info.authors.join(", ") : "Unknown author";
        showBook(title, author, isbn);
        return;
      }
    }
  } catch (e) {
    console.warn("Google Books failed/timeout:", e.name);
  }

  // --- 2. Open Library search ---
  try {
    resultEl.innerHTML = "Trying Open Library…";
    const res = await fetchWithTimeout(
      "https://openlibrary.org/search.json?isbn=" + encodeURIComponent(isbn) +
      "&fields=title,author_name&limit=1"
    );
    if (res.ok) {
      const data = await res.json();
      if (data.docs && data.docs.length > 0) {
        const doc = data.docs[0];
        const title = doc.title || "Unknown title";
        const author = doc.author_name ? doc.author_name.join(", ") : "Unknown author";
        showBook(title, author, isbn);
        return;
      }
    }
  } catch (e) {
    console.warn("Open Library search failed/timeout:", e.name);
  }

  // --- 3. Open Library direct ISBN endpoint ---
  try {
    resultEl.innerHTML = "Trying Open Library (direct)…";
    const res = await fetchWithTimeout(
      "https://openlibrary.org/isbn/" + encodeURIComponent(isbn) + ".json"
    );
    if (res.ok) {
      const data = await res.json();
      const title = data.title || "Unknown title";
      let author = "Unknown author";
      if (data.by_statement) {
        author = data.by_statement;
      } else if (data.authors && data.authors.length) {
        author = data.authors.map(a => a.name || "").filter(Boolean).join(", ") || author;
      }
      showBook(title, author, isbn);
      return;
    }
  } catch (e) {
    console.warn("Open Library /isbn/ failed/timeout:", e.name);
  }

  // Everything failed or timed out
  resultEl.innerHTML = `
    <div class="book" style="border-color:#c00;">
      <b>Could not look up ISBN ${isbn}</b><br><br>
      All sources timed out or returned nothing.<br>
      Open Library is often slow/down right now.<br><br>
      You can still add the book manually, or try scanning again in a minute.
    </div>`;
}

function addScannedBook(title, author) {
  const exists = books.some(
    b => b[0].toLowerCase() === title.toLowerCase()
  );

  if (exists) {
    alert("This book is already in your library.");
    return;
  }

  books.push([title, author]);
  localStorage.setItem("penguinLibraryBooks", JSON.stringify(books));

  alert(title + " added!");
  document.getElementById("scanResult").innerHTML = "";
  render();
}

document.getElementById("search").addEventListener("input", render);
render();
</script>
